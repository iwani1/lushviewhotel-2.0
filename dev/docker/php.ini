; PHP settings for local development.
;
; The installer enforces minimums at install-dev/controllers/http/system.php
; (memory_limit >= 128M, max_execution_time >= 500, upload_max_filesize >= 16M,
; allow_url_fopen = On). Every value below exceeds those minimums, so the
; installer's requirements screen passes on the first attempt.

memory_limit = 256M
max_execution_time = 600
max_input_time = 600

; Room photography and the 16 MB database dump both need headroom.
upload_max_filesize = 64M
post_max_size = 72M

allow_url_fopen = On

; Match the live hotel's timezone rather than the container default (UTC).
date.timezone = Africa/Accra

display_errors = Off
log_errors = On
error_reporting = E_ALL

; Opcache off during development, otherwise edited PHP files appear not to
; take effect until the container restarts.
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
